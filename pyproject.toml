[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "combine-bot"
version = "0.1.0"
description = "Opening-range breakout bot and Topstep Combine simulator using the ProjectX API"
requires-python = ">=3.11"
dependencies = ['tzdata; sys_platform == "win32"']

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
combine-bot = "combine_bot.cli:main"

[tool.setuptools]
packages = ["combine_bot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
